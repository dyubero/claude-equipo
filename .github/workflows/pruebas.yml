name: pruebas

on:
  push:
  pull_request:

jobs:
  scripts:
    name: scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identidad de git para los repositorios temporales
        run: |
          git config --global user.name "pruebas"
          git config --global user.email "pruebas@example.invalid"
          git config --global init.defaultBranch main
      - run: npm run test:scripts

  # Los mods se prueban con `claude plugin test`. Va aparte y no hace fallar el conjunto: sirve para saber si esa orden
  # funciona en CI sin iniciar sesión.
  mods:
    name: mods (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: npm run test:plugin
